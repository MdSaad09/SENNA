# SENNA — fitted driver identity (F17). Generated by senna.physics.fits.run;
# edit the fitters or configs/fits.yaml, never this file by hand.
#
# Read these as SEAT effects, not driver skill. Era 2024 pools 2022-2025, and a
# driver's coefficient is their offset within their own sessions across whatever
# cars they drove in those seasons — the `seasons` and `n_laps` beside each entry
# say which. Session fixed effects absorb per-session mean pace, and the effects are
# between-driver contrasts within a session, so they carry no AR-10 fuel grade even
# in 2026 (the same reasoning as trend_s_per_lap and sigma_driver_s next door).
#
# An unnamed seat is not in here. It is code behaviour: senna/env/lineup.py leaves
# it NaN and reset draws it from sigma_driver_s, which is why there is no null
# fallback row — a null constant is one the write gate refuses.

