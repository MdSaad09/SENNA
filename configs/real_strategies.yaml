# SENNA — recorded real race strategies for the replayed-real baseline (F06, A-07, M2).
# One entry per recorded race, keyed season_circuit_driver: M2's frozen ten carry two
# British GPs (2024 HAM, 2023 NOR), so a circuit key alone cannot hold the set. Season,
# circuit and driver are explicit fields — the key is derivable, never load-bearing
# alone. Checked in so a rollout — and CI — never touches the database.
#
# Origin: sourced, every entry — extracted from the ingested FastF1 store by
# `python -m senna.strategy.extract --season <s> --circuit <c> [--driver <ABC>] --write`
# (senna/strategy/extract.py; the writer regenerates entries wholesale, so per-line
# notes do not survive it and provenance lives here and in each source: field).
# real_total_laps is that season's race distance; sim_total_laps the era circuit
# config's; stops are (out-lap, compound taken), lap-rescaled where the two differ.
# The start compound is not replayed — the env fixes everyone on MEDIUM (5.5) — so a
# stops-only plan replays the tyre sequence, run on balanced modes (an earlier era's
# strategy carries no 2026 energy decision).

2024_bahrain_grand_prix_VER:
  season: 2024
  circuit: bahrain_grand_prix
  driver: VER
  source: FastF1 2024 Bahrain Grand Prix, VER (race winner) — senna.strategy.extract
  real_total_laps: 57
  sim_total_laps: 57
  stops:
  - [18, HARD]
  - [38, SOFT]
