# SENNA — per-event circuit facts (E-02). Hand-maintained, sourced; never generated.
# h_max_mj is the FIA per-event recoverable-energy cap (AR-05: 8.5 MJ baseline,
# ~5-9 MJ adjusted per event, extra reductions in some qualifying sessions).
# race_laps is the scheduled race distance in laps (the published 2026 lap count; for a
# circuit with no raced 2026 event it falls back to the 305 km — 260 km at Monaco —
# distance rule over the lap length). F05 reads it as the episode horizon (5.5).
# Every entry carries a source note and date; substitute a sourced per-event figure
# as reporting surfaces it and rerun make synth — the code reads only this file.
# One entry per ingested event (E-13: the index is data-driven; Madrid appears
# with its first ingested session, September 2026).

