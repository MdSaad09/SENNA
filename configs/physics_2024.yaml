# SENNA — 2024-era constants, used only for era-matched counterfactuals (F-24 / A-10).
# Same env code, different constants file. Origins as in physics_2026.yaml.
#
# borrowed: this file deliberately carries no fitted energy-mode block. The four
# coefficients (conserve_pace_cost_s_per_mj, attack_pace_gain_s, derate_penalty_s_per_mj,
# attack_soc_floor_mj) come from physics_2026.yaml's fitted block for BOTH eras
# (senna/env/scenario.py) — no 2024 fit of them exists. The borrow is priced, not
# assumed: `make sensitivity-m2` re-rolls the ten M2 races with the block at +/-50%
# (configs/eval.yaml sensitivity.energy_coefficients; senna/eval/coefficients.py) and
# the report prints the spread beside M2.

era: "2024"

power_unit:
  mgu_k_max_kw: 120            # sourced (A) — 2014–2025 PU regulations
  ice_max_kw: 560              # sourced (B) — approximate, spec 5.2 table
  drs: true                    # the era's overtaking aid; no Manual Override
  mgu_h: true

energy_store:
  usable_capacity_mj: 4.0      # sourced AR-04 (A) — unchanged across eras

harvest:
  mgu_k_per_lap_cap_mj: 2.0    # sourced (A) — 2024-era MGU-K recovery limit, spec 5.2
  braking_energy_mj_per_lap_default: 9.0  # stylised — era fallback where a circuit has no 2024 energy
                                          # fit (Canada, Paul Ricard); 2024 harvest is capped at the
                                          # 2 MJ MGU-K limit above, so this only needs to exceed the cap

mass:
  minimum_car_kg: 798          # sourced (B) — spec 5.2, approximate
  race_fuel_kg: 100            # sourced (A) — 2024-era allowance, spec 5.2

sporting:
  grid_size: 20
  drs_detection_gap_s: 1.0     # sourced (A) — 2011-2025 sporting regs; same 1.0 s
                               # detection rule as the 2026 Manual Override, so T7's
                               # opportunity definition is era-symmetric (F-05)
  fastest_lap_point: false     # abolished from 2025; 2023/24 replays that predate the
                               # change are handled in evaluation, never as an agent
                               # action or reward (F-07, R-01)
  mandatory_dry_compounds: 2
