# SENNA — serving-layer constants (F10, spec 5.9/5.11). The API and the worker read
# this file through senna.config; nothing serving-shaped carries an inline number.
# "operational" is the fourth provenance origin (decisions log, 22 Jul 2026): an
# explicit engineering default, stated and reviewable, distinct from stylised
# visual choices.

cache:
  ttl_days: 7 # sourced — E-15: the backstop TTL; versioned keys are the real guard
  key_prefix: sim # sourced — 5.9.3 key scheme sim:{model_version}:{env_hash}:...

channels:
  events_prefix: events # sourced — 5.9.3: pub/sub channel events:{run_id}

queue:
  name: default # sourced — 5.9.3: "queue default RQ"
  job_timeout_s: 600 # operational — RQ's own default is a silent 180 s; a full race
                     # with per-lap TreeSHAP and pit-lap flip probes takes seconds,
                     # so this is an order-of-magnitude margin, not a tuned figure
  result_ttl_s: 86400 # operational — results live in Postgres (E-16); RQ's copy is
                      # queue bookkeeping only, one day keeps a failed job visible
                      # on the dashboard across a working day
  stale_after_timeouts: 2 # operational — a queued/running row older than two job
                          # budgets means the work horse died before it could report
                          # (OOM, SIGKILL): its cache key is deleted and the request
                          # re-runs rather than pointing at a corpse for 7 days (E-15)

playback:
  # 1x means one wall-clock second per simulated second; each multiplier divides the
  # stored lap time. The clock reads persisted frames and never re-runs physics
  # (E-16); the definition is stylised and F13 states it on screen.
  speeds: [1, 5, 10, 30] # sourced — 5.9.3 client:speed set

frames:
  page_size: 100 # operational — a race is 44 to 78 laps (configs/circuits.yaml), so
                 # the default /frames page returns any whole race in one response
  # s_track is a display-only synthesis, stylised: car progress when the leader
  # crosses the line = (1 - gap_to_leader_s / nominal_lap_s) mod 1, nominal lap time
  # from the circuit scenario. The env is lap-quantised and holds no mid-lap
  # position; F11 interpolates between frames and labels it illustrative.

health:
  max_response_ms: 250 # operational — the F10 "stated threshold": a running
                       # simulation may never block /health past this

cors:
  allow_origins: # sourced — 5.11.1: "CORS allowlist = frontend origin"; the
    - http://localhost:5173 # production origin arrives via CORS_ORIGIN at deploy time

live_cards:
  flip_on_pit_only: true # sourced — 5.8.2: flip probes are "for headline decisions",
                         # and a pit call is the headline; stay-out laps skip the sweep

ws:
  status_poll_s: 0.5 # operational — store poll cadence while a run is still
                     # queued or running; the race itself finishes in seconds

weather_profiles: # sourced — the 5.9.2 request literals, mapped onto the env's two
  dry: dry        # modes. mixed and wet_risk both run the markov chain until the env
  mixed: markov   # grows a wetness prior (decision Q2, 22 Jul 2026); the requested
  wet_risk: markov # profile is recorded verbatim on the run either way

seeds:
  draw_bound: 2147483648 # operational — server-drawn seeds land in the signed-int32
                         # SimulationRun.seed column, so the draw stays below 2**31

baked_models:                       # F-24 — the triplets this image can serve
  - headline                        # operational — the frozen 2026 headline (F08), the default
  - era2024                         # operational — the era-matched fine-tune the counterfactual
                                    # route serves (F-24). Absent until make finetune has run;
                                    # the loader skips what it cannot find so a fresh clone
                                    # still serves the headline
