# SENNA — frozen RL seed banks (F07, master spec 5.7; the E-14 discipline applied to
# episode seeds). Committed before the first training run; editing any value after a
# result exists is seed-shopping, and the viva reads this header the way it reads
# data_split.yaml's. Every seed is stylised-frozen: drawn once via
# np.random.default_rng(20260719).integers(100000, 1000000), de-duplicated in draw
# order, then allocated top to bottom exactly as this file is laid out. The banks are
# pairwise disjoint, and disjoint from the per-suite test seeds (99/271/512/704/846)
# and the headline seeds below by construction (those all sit under 100000).
#
# stage_c.test is RESERVED for the F14 evaluation: senna/train/seeds.py refuses to
# hand it to any consumer but "F14", and nothing in senna/train reads it (E-06's
# held-out discipline, applied to seeds).

