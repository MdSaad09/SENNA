# SENNA — thresholds the F02 fitting battery reads (inputs, never outputs).
# Fitted results land in physics_params.yaml; this file is where every knob the
# fitters take as an argument gets its named origin. null means "fit me": code
# that reads a null must raise, never guess.

# The write gates. Both default true; setting either false reproduces the pre-F18
# battery, which is how the defect was demonstrated rather than argued. Leave them true.
gates:
  require_full_season_coverage: true  # operational — switches both E-12 coverage checks:
                                      # a declared season absent from the store, and a
                                      # season the store holds that reaches no pace fit.
                                      # The second is the one F18 was built for. The
                                      # committed physics was NOT written from a partial
                                      # store — its own watermark said "seasons 2022-2026"
                                      # and every season was there — but 2022 and 2023
                                      # reached hazards, pit loss and energy and reached
                                      # no joint pace fit, so base pace came from 1958
                                      # laps of an available 3705 under a watermark
                                      # claiming all four (A-09)
  require_finite_params: true         # operational — refuse NaN and Inf as well as null
                                      # in a fitted value. validate_complete tested
                                      # `is None`, and a NaN is not None, so a failed fit
                                      # could render the bare literal `nan` into the yaml
                                      # for F05 to load back as a poisoning float (E-09)

fuel:
  sc_burn_factor: 0.6        # stylised — SC/VSC laps burn less than green ones;
                             # the exact ratio is a visual choice, sensitivity
                             # shown in notebooks/fit_joint_pace.ipynb (T6)

joint_pace:
  vif_max: 30                # stylised — above this the fuel/evolution attribution
                             # is flagged and decomposed via the pooled k_m (E-10)

degradation:
  min_laps: 30               # stylised — sample gates below which a fit is kept
  min_stints: 3              #   but flagged low_confidence for T5 transfer
  min_drivers: 2
  min_max_age: 12            # stylised — the curve must be constrained past this age
  curve_bounds:              # stylised — scipy curve_fit bounds keeping the
    a: [0.0, 5.0]            #   grip power law physical: a >= 0, shape in a
    b: [0.3, 3.0]            #   plausible wear-to-cliff range
  curve_p0: [0.05, 1.2]      # stylised — solver seed near mild, slightly
                             #   superlinear wear; inside the bounds by design
  curve_maxfev: 10000        # stylised — scipy default is too small for the
                             #   flat-residual circuits that end at a = 0

driver_identity:             # F17 — the gates on what may be said about a named driver
  min_laps_for_seat_pace: 30 # stylised — clean laps a driver needs at one circuit-era
                             # before their seat effect is published per circuit; below it
                             # they keep their mean over the circuits that did clear.
                             # Mirrors degradation.min_laps, and sized on the store: it
                             # clears 628 of 652 era-2024 driver-circuit cells and 190 of
                             # 235 era-2026 ones, so it refuses the thin cells without
                             # gutting coverage (notebooks/fit_driver_identity.ipynb)
  min_stints_for_deg_mult: 12  # stylised — a floor, not the gate that bites: the thinnest
                             # era-2024 driver already has 12 stints and the median has 132
  max_rel_se_for_deg_mult: 0.10  # stylised — the gate that does bite. Relative standard
                             # error of the multiplier, clustered by stint, above which the
                             # style is not identified and the pooled curve stands. This is
                             # E-10's discipline one layer down: a count asks how much data
                             # arrived, a standard error asks whether it pinned the answer
                             # down. Sized against the committed curve distribution — a
                             # driver with the era-2024 median 132 stints lands at p90
                             # 0.019-0.051, an era-2026 median 29-stint driver at
                             # 0.053-0.109, and a 12-stint driver at 0.084-0.220, so 0.10
                             # admits a full era of running and refuses a reserve seat

hazards:
  wilson_z: 1.96             # sourced — 95% two-sided normal quantile

pit_loss:
  max_duration_s: 60         # stylised — beyond this a pit_duration is a penalty
                             # or red-flag stop, excluded and counted, never silent

energy:
  throttle_full_pct: 98      # stylised — full-throttle threshold on the Throttle
                             # channel; 100% would miss sensor jitter (AR-16)

clusters:
  k_range: [2, 6]            # stylised — silhouette search range for T5 transfer
  seed: 20260715             # stylised — KMeans determinism; a make fit rerun
                             # must not reshuffle transfer donors
