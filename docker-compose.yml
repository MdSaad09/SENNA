services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: senna
      POSTGRES_PASSWORD: senna # local dev only; Railway injects plugin credentials (5.11.2)
      POSTGRES_DB: senna
    volumes:
      - pgdata:/var/lib/postgresql/data
      # creates senna_test on first boot: the DB tests refuse to run anywhere else
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U senna"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      # service names are fine here: these values never reach a browser (5.11.2, F-27)
      DATABASE_URL: postgresql+asyncpg://senna:senna@postgres:5432/senna
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # the Streamlit interface — the only thing a reader opens. It talks to the API over
  # HTTP, so the research code has exactly one entry point and the interface has none
  # of its own (MH4 on GH1's backend).
  app:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: streamlit run app/Home.py --server.port 8501 --server.address 0.0.0.0
    environment:
      SENNA_API_BASE: http://api:8000/api/v1
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  pgdata:
