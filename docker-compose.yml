services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: senna
      POSTGRES_PASSWORD: senna # local dev only; Railway injects plugin credentials (5.11.2)
      POSTGRES_DB: senna
    volumes:
      - pgdata:/var/lib/postgresql/data
      # creates senna_test on first boot: the DB tests refuse to run anywhere else
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U senna"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      # service names are fine here: these values never reach a browser (5.11.2, F-27)
      DATABASE_URL: postgresql+asyncpg://senna:senna@postgres:5432/senna
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    # same image as the api (5.11.1); only the start command differs
    build:
      context: .
      dockerfile: Dockerfile.api
    command: scripts/start_worker.sh
    environment:
      DATABASE_URL: postgresql+asyncpg://senna:senna@postgres:5432/senna
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      # masks the host's mac-native node_modules; the container installs its own
      - /app/node_modules
    environment:
      VITE_API_BASE: /api
      # ws:// straight at the published api port — master spec 5.11.2 wins over the
      # feature spec's /ws proxy idea (plan divergence 6); browser-reachable, so no
      # Docker hostname (F-27)
      VITE_WS_BASE: ws://localhost:8000/ws
      # proxy target is server-side, so the compose service name is allowed (F-27)
      API_PROXY_TARGET: http://api:8000
    command: sh -c "npm ci && npm run dev -- --host --port 5173"
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
