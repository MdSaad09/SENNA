name: ci

on: push

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine  # matches docker-compose.yml
        env:
          POSTGRES_USER: senna
          POSTGRES_PASSWORD: senna
          POSTGRES_DB: senna_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U senna"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://senna:senna@localhost:5432/senna_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: alembic upgrade head  # the migration itself must apply cleanly (F01)
      - run: alembic check  # and match schema.py — drift would hide behind create_all tests
      # two invocations: Streamlit's AppTest leaves its runtime installed, and a
      # SubprocVecEnv spawned afterwards re-executes a page in the child process
      - run: pytest -m "not slow" --ignore=tests/app
      - run: pytest -m "not slow" tests/app
      - run: make verify  # F15: the chapter regenerates byte-for-byte and no public link rots

