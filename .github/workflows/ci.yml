name: ci

on: push

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine  # matches docker-compose.yml
        env:
          POSTGRES_USER: senna
          POSTGRES_PASSWORD: senna
          POSTGRES_DB: senna
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U senna"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://senna:senna@localhost:5432/senna
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: alembic upgrade head  # the migration itself must apply cleanly (F01)
      - run: pytest -m "not slow"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm test
