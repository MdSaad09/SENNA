# SENNA — F1RaceEnv constants (F05, master spec 5.5). Env-level and era-shared knobs
# that the per-circuit and per-era physics files do not already carry. Per-circuit and
# per-era numbers live in physics_params.yaml, physics_2026/2024.yaml, transforms.yaml
# and circuits.yaml; this file holds only what those do not.
#
# Origins: sourced (spec section or FIA regs, with the id), fitted (which notebook), or
# stylised (an explicit modelling choice). Anything stylised names the future feature and
# data source that could replace it with a fit — its policy-sensitivity is an F08/F14
# ablation question, not something F05 tries to settle.

obs:                              # 5.5.1 observation normalisers — all sourced from the table
  tyre_age_norm_laps: 40          # sourced spec 5.5.1 — tyre_age_norm = age / 40 (also #20/#22 deltas)
  max_stops_norm: 3               # sourced spec 5.5.1 — pit_count_norm = stops / 3
  gap_norm_cap_s: 30              # sourced spec 5.5.1 — gap_*_norm = min(gap, 30) / 30
  track_temp_min_c: 15            # sourced spec 5.5.1 — track_temp_norm = (T - 15) / 45
  track_temp_span_c: 45           # sourced spec 5.5.1
  tyre_cold_age_laps: 1           # stylised — a set younger than this reads cold on its out-lap (obs #11)

reward:
  pace_weight_w_p: 0.02           # sourced spec 5.5.4 — per-lap pace-shaping weight
  position_potential_coef: 0.1    # sourced spec 5.5.4 — Phi(s) = -0.1 * position (F-15)
  points_divisor: 2.5             # sourced spec 5.5.4 — sets P1 = 10.0
  points_2026: [25, 18, 15, 12, 10, 8, 6, 4, 2, 1]  # sourced — FIA 2026 sporting regs,
                                  # P1..P10; the fastest-lap point is abolished (AR-11, F-07)
  gamma: 1.0                      # sourced spec 5.5.4 — the race is a finite horizon, so the
                                  # return is undiscounted; potential-based shaping then
                                  # telescopes to exactly zero over a closed loop (F-15).
                                  # F07's PPO discount must also be 1.0, or the mismatch is a
                                  # conscious F07 choice.

deploy:
  mode_request_frac:              # stylised — share of the circuit's E_dep each pace mode asks
                                  # for; an energy-budget fit could set these (F08)
    conserve: 0.3
    balanced: 0.6
    attack: 1.0
    defend: 0.8

forced_pit:
  tyre_failure_penalty_s: 25.0    # sourced spec 5.5.3 / 5.5.5 — kept from v2

tyre_failure:
  cliff_age_margin_laps: 3        # stylised — laps past a compound's max_age_seen where the
                                  # failure hazard engages; a survival fit on stint-end
                                  # retirements could set it (F08)
  hazard_per_lap_beyond_cliff: 0.05  # stylised — per-lap failure probability past the cliff (F08)

pit_loss_mult:                    # E-03 — relative pit loss under neutralisation vs a green stop
  vsc: 0.65                       # stylised — spec 5.5.3 anticipates a fit from 2022-2026
                                  # neutralised stops (F06/F08)
  sc: 0.5                         # stylised — a bunched field roughly halves relative pit loss
                                  # (E-03); same future source

pit:
  min_service_s: 2.0              # stylised — FIFO stationary-time floor; the per-car draw itself
                                  # uses pit_loss.{mean_s, sigma_s} from physics_params.yaml (E-05)
  lane_gap_s: 1.0                 # stylised — minimum spacing the FIFO pit lane enforces between
                                  # cars, the mechanism behind double-stacking losses (E-05)

events:
  sc_duration_laps: 3             # stylised — laps a safety car neutralises the race before green
  vsc_duration_laps: 2            # stylised — laps a virtual safety car lasts
  red_flag_max_per_race: 1        # stylised — at most one red flag per race (E-04 is a rare event)

red_flag:
  free_tyre_change: true          # sourced E-04 — every car may change compound at the restart

weather:
  n_sectors: 3                    # sourced E-08 — wetness integrates sub-lap over three sectors
  markov:                         # stylised — dry/damp/wet per-lap transition rows (each sums to 1);
                                  # a fit from FastF1 weather traces could set it (F06/F08)
    dry: [0.98, 0.02, 0.0]
    damp: [0.1, 0.8, 0.1]
    wet: [0.0, 0.15, 0.85]
  target_wetness:                 # stylised — wetness each regime tends toward, integrated sub-lap (E-08)
    dry: 0.0
    damp: 0.5
    wet: 0.9
  wet_mismatch_penalty_s: 3.0     # stylised — pace cost for a compound that does not suit the
                                  # current wetness (E-08 crossover); an F08 wet-race fit could set it
  track_temp_dry_c: 30.0          # stylised — baseline dry track temp for obs #32; the deg fit
                                  # (a*age^b) carries no temp term, so this feeds the observation only
  track_temp_wet_drop_c: 15.0     # stylised — track cools by up to this much in full wet

compound_validity:                # E-08 — action-mask thresholds on continuous wetness in [0, 1]
  slick_max_wetness: 0.3          # stylised — slicks masked above this (F08 crossover fit)
  inter_band: [0.25, 0.75]        # stylised — Intermediate valid within this damp band
  wet_min_wetness: 0.7            # stylised — full Wet valid at or above this

traffic:
  dirty_air_penalty_s: 0.4        # stylised — pace lost per lap inside the dirty-air threshold;
                                  # the 2.0 s threshold and the 2026 aero scale live in
                                  # physics_2026.yaml. A stint-pace-in-traffic fit could set it (F06/F08)

harvest:
  intra_lap_share: 0.6            # stylised — fraction of this lap's harvest usable for same-lap
                                  # deploy (spec 5.5.3 intra_lap_share); a telemetry-integral fit (F08).
                                  # Per-lap harvest itself is the fitted h_max flow cap over
                                  # harvest_braking_mj (transforms.yaml t4_energy) — the banking
                                  # mechanic lives in how much each mode deploys, not in harvest.
  neutralized_scale: 0.5          # stylised — braking harvest falls under SC/VSC (fewer hard stops),
                                  # so obs #16 last_lap_harvest_frac carries a real banking signal (F08)

# The rival field is no longer a placeholder: F06 draws three archetypes per race from
# configs/rivals.yaml (senna/env/rivals.py), so the equal-pace stub that lived here is gone.
