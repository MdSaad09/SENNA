[project]
name = "senna"
version = "0.1.0"
description = "F1 strategy engine: lap-level 2026 simulator, MaskablePPO strategist, SHAP explanations"
requires-python = ">=3.11,<3.12"

[tool.uv]
# nothing imports senna as an installed package yet; tests run from the repo root
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# bare `pytest` (CI) must resolve api/ and senna/ the same way `python -m pytest` does
pythonpath = ["."]
markers = [
    "slow: excluded from the fast suite and from CI push runs",
    "property: hypothesis property tests (first arrive with F05)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# Tests-first features import senna/api/worker submodules that do not exist on disk
# yet; without this, ruff classifies those imports as third-party and I001 flips once
# the module lands (the warm-cache trap that reddened F03-F06).
known-first-party = ["senna", "api", "worker"]

[tool.ruff.lint.per-file-ignores]
# Notebooks are linear, exploratory artifacts: a long argparse/setup line (E501) and
# semicolon-joined matplotlib calls like `ax.set_xlabel(...); ax.set_ylabel(...)` (E702)
# read fine there. The substantive checks — dead imports (F401), undefined names,
# import sorting — still apply to *.ipynb.
"*.ipynb" = ["E501", "E702"]
