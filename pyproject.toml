[project]
name = "senna"
version = "0.1.0"
description = "F1 strategy engine: lap-level 2026 simulator, MaskablePPO strategist, SHAP explanations"
requires-python = ">=3.11,<3.12"

[tool.uv]
# nothing imports senna as an installed package yet; tests run from the repo root
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: excluded from the fast suite and from CI push runs",
    "property: hypothesis property tests (first arrive with F05)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
